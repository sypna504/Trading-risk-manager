services:
  backend:
    build:
      context: .
      dockerfile: app/backend/api/dockerfile
    container_name: python-fastapi-backend
    ports: ["8000:8000"]
    environment:
      ML_SERVICE_ADDRESS: ml_service:50051
      PYTHONUNBUFFERED: "1"
      MIN_CANDLES: "60"
      DATABASE_PATH: /app/data/trading_risk.db
      MODEL_REGISTRY_PATH: /app/app/ml_services/app/models/registry.json
      OUTCOME_AUTO_EVALUATION: "true"
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_PATH: ${TELEGRAM_SESSION_PATH:-/app/data/telegram.session}
      NEWS_LLM_PROVIDER: ${NEWS_LLM_PROVIDER:-rule_based}
      NEWS_LLM_URL: ${NEWS_LLM_URL:-http://ollama:11434}
      NEWS_LLM_MODEL: ${NEWS_LLM_MODEL:-}
      NEWS_LLM_TIMEOUT_SECONDS: ${NEWS_LLM_TIMEOUT_SECONDS:-8}
      NEWS_CONTEXT_ENABLED: ${NEWS_CONTEXT_ENABLED:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000/}
    depends_on:
      ml_service: {condition: service_healthy}
    volumes:
      - ./app/ml_services/app/models:/app/app/ml_services/app/models:ro
      - backend_data:/app/data
      - ./runtime:/app/runtime:ro
    healthcheck:
      test: ["CMD","python","-c","import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)); assert d.get('readiness') == 'ready'"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  ml_service:
    build: {context: ., dockerfile: app/ml_services/dockerfile}
    container_name: ml-services-grpc
    ports: ["50051:50051"]
    environment:
      ML_SERVICE_PORT: "50051"
      MIN_CANDLES: "60"
      PYTHONUNBUFFERED: "1"
      ML_MODELS_ROOT: /app/app/models
      ML_REGISTRY_PATH: /app/app/models/registry.json
      ML_HISTORY_PATH: /app/app/training/data/history_data.parquet
      ML_DATASET_PATH: /app/app/training/data/ml_dataset_v3.parquet
    volumes:
      - ./app/ml_services/app/models:/app/app/models:ro
      - ./app/ml_services/app/training/data:/app/app/training/data:ro
    healthcheck:
      test: ["CMD","python","-m","app.online.healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  ml_trainer:
    profiles: ["training"]
    build: {context: ., dockerfile: app/ml_services/dockerfile}
    container_name: ml-trainer
    command: ["python","-m","app.training.retrain_pipeline","--mode","manual"]
    environment:
      PYTHONUNBUFFERED: "1"
      MIN_CANDLES: "60"
      ML_EXCHANGE: binance
      ML_INTERVAL: 1h
      ML_SUPPORTED_INTERVALS: 1h
      ML_FEATURE_SCHEMA_VERSION: v3
      ML_TARGET_HORIZON_MINUTES: "180"
      ML_MODELS_ROOT: /app/app/models
      ML_REGISTRY_PATH: /app/app/models/registry.json
      ML_HISTORY_PATH: /app/app/training/data/history_data.parquet
      ML_DATASET_PATH: /app/app/training/data/ml_dataset_v3.parquet
      ML_RESEARCH_ROOT: /app/runtime/research
    volumes:
      - ./app/ml_services/app/models:/app/app/models
      - ./app/ml_services/app/training/data:/app/app/training/data
      - ./runtime:/app/runtime

  news_service:
    build: {context: ., dockerfile: app/news_service/Dockerfile}
    container_name: trading-risk-news
    ports: ["8010:8010"]
    environment:
      DATABASE_PATH: /app/data/trading_risk.db
      NEWS_LLM_PROVIDER: ${NEWS_LLM_PROVIDER:-rule_based}
      NEWS_LLM_URL: ${NEWS_LLM_URL:-http://ollama:11434}
      NEWS_LLM_MODEL: ${NEWS_LLM_MODEL:-}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_PATH: ${TELEGRAM_SESSION_PATH:-/app/data/telegram.session}
    volumes: ["backend_data:/app/data"]

  frontend:
    build: {context: ., dockerfile: app/frontend/Dockerfile}
    container_name: trading-risk-frontend
    ports: ["3000:80"]
    depends_on:
      backend: {condition: service_healthy}

  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    container_name: trading-risk-ollama
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]

  postgres:
    profiles: ["postgres"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trading_risk
      POSTGRES_USER: trading_risk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paper-only}
    volumes: ["postgres_data:/var/lib/postgresql/data"]

volumes:
  backend_data:
  ollama_data:
  postgres_data:
