name: trading-risk-final-ci
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
env: {PYTHON_VERSION: "3.11"}
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - run: python -m pip install PyYAML pydantic pydantic-settings
      - run: python -m compileall -q app tests scripts
      - run: python scripts/check_dependency_contract.py
      - run: python scripts/check_settings_contract.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-test.txt
      - run: python scripts/generate_proto.py --output .
      - run: python -m pytest -q tests/regression tests/smoke tests/integration/test_synthetic_e2e.py

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-test.txt
      - run: PYTHONPATH=app/ml_services python -m pytest -q app/ml_services/app/training/tests

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q tests/news_research tests/geopolitical
      - run: python scripts/news_fusion_synthetic.py

  automl-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-test.txt
      - run: PYTHONPATH=app/ml_services python -m app.research.synthetic_runner

  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q tests/news

  agent-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q tests/agent tests/paper tests/integration/test_full_platform_synthetic.py

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: app/frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: app/frontend/package.json}
      - run: npm install
      - run: npm test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build backend ml_service news_service frontend

  docker-integration:
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build ml_service backend news_service frontend
      - run: |
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/api/v1/health && curl -fsS http://127.0.0.1:3000/ && exit 0; sleep 5; done; docker compose logs; exit 1
      - if: always()
        run: docker compose down -v

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, ml, research, news, agent-paper]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q tests/integration/test_full_platform_synthetic.py
