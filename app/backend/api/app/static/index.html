<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trading Risk Manager</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="container">
    <section class="hero">
      <p class="eyebrow">MVP · рекомендательная система</p>
      <h1>Trading Risk Manager</h1>
      <p>Проверка торгового сигнала, оценка CatBoost и расчёт риска без исполнения сделок.</p>
    </section>

    <section class="panel">
      <form id="decision-form" class="form-grid">
        <label>Биржа
          <select id="exchange">
            <option value="binance">Binance</option>
            <option value="bybit">Bybit</option>
          </select>
        </label>
        <label>Торговая пара
          <input id="symbol" value="BTCUSDT" required>
        </label>
        <label>Интервал
          <select id="interval">
            <option value="1m">1m</option>
            <option value="5m">5m</option>
            <option value="15m">15m</option>
            <option value="1h" selected>1h</option>
            <option value="4h">4h</option>
            <option value="1d">1d</option>
          </select>
        </label>
        <label>Количество свечей
          <input id="limit" type="number" value="100" min="60" max="5000">
        </label>
        <label>Баланс
          <input id="account-balance" type="number" value="1000" min="1" step="0.01">
        </label>
        <label>Риск на сделку, %
          <input id="risk-per-trade" type="number" value="1" min="0.01" max="10" step="0.01">
        </label>
        <label>Максимальная доля позиции, %
          <input id="max-position-share" type="number" value="25" min="1" max="100" step="0.1">
        </label>
        <button id="submit-button" type="submit">Проверить сигнал</button>
      </form>
      <p id="status" class="status"></p>
    </section>

    <section id="result" class="panel hidden"></section>

    <section class="panel">
      <div class="section-header">
        <h2>Последние решения</h2>
        <button id="refresh-history" class="secondary" type="button">Обновить</button>
      </div>
      <div id="history" class="history"></div>
    </section>

    <footer>
      Система не является финансовой рекомендацией и не исполняет реальные сделки.
    </footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
